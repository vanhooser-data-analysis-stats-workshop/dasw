name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run MATLAB unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          # Put the repo root (parent of +dasw) on the path so dasw.* resolves.
          source-folder: .
          # Discover tests under tests/, including package subfolders.
          select-by-folder: tests
